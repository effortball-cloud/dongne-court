<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="동네코트: 서울 공공 체육시설 지도. 농구·야구·풋살·테니스·배드민턴 코트 위치, 예약 접수일, 이번 주말 날씨를 한 화면에.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동네코트"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>동네코트 · 서울 공공 체육시설 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>/* 동네코트 — 밝은 바탕 + 코발트 블루 1색 + 회색. ROOKIE B(어두운 초록)와 다른 별도 브랜드.
   색·글자 크기·간격은 아래 토큰만 쓴다. 어두운 모드는 토큰만 바꾼다. 대비 4.5:1 이상(tests/test_ui_tokens.py). */
:root{
  color-scheme:light;
  /* 바탕 */
  --bg:#f4f5f7; --card:#fff; --soft:#eef0f3; --veil:rgba(255,255,255,.96); --line:#e1e4e9; --line2:#c4cad3;
  /* 글자 */
  --tx:#14171c; --tx2:#434b59; --tx3:#5c6472;
  /* 강조 1색: 채움(--ac) · 채움 위 글자(--on-ac) · 강조 글자(--ac-tx) · 옅은 바탕(--ac-bg) */
  --ac:#1a5cff; --on-ac:#ffffff; --ac-tx:#0f44cc; --ac-bg:#e8eeff; --ac-line:#b3c6ff;
  --warn:#8a4b00; --warn-bg:#fff4e5; --warn-line:#f5cf99;
  --shade:rgba(16,24,40,.38);
  /* 글자 크기 6단계 */
  --fs-cap:12px; --fs-sm:13.5px; --fs-body:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px;
  /* 모양 */
  --r-sm:8px; --r:12px; --r-lg:16px; --tap:44px;
  --sh-1:0 1px 2px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
  --sh-2:0 2px 6px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.08);
  --head-h:56px; --tab-h:60px; --notice-h:0px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0f1217; --card:#171b22; --soft:#20252e; --veil:rgba(23,27,34,.95); --line:#2a303a; --line2:#434b58;
    --tx:#eef1f5; --tx2:#c3cad5; --tx3:#9ea7b4;
    --ac:#2f62f0; --on-ac:#ffffff; --ac-tx:#93b2ff; --ac-bg:#17223f; --ac-line:#2e4682;
    --warn:#ffc37a; --warn-bg:#2d2114; --warn-line:#5c4220;
    --shade:rgba(0,0,0,.55);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 4px 20px rgba(0,0,0,.45);
  }
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
  #map{background:#1b1f26!important}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--fs-body);line-height:1.5;
  word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
a{color:var(--ac-tx)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.i.s{width:16px;height:16px;vertical-align:-3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:820px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}

/* 머리줄: 이름 · 한 줄 설명 · 주 행동 */
header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;
  height:calc(var(--head-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  background:var(--veil);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ac);position:relative;flex:none}
.mark:before{content:"";position:absolute;inset:5px;border:2px solid #fff;border-radius:2px}
.mark:after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;background:#fff}
.bt{min-width:0;line-height:1.2}
.logo{margin:0;font-weight:900;font-size:var(--fs-xl);letter-spacing:-.5px;color:var(--tx);white-space:nowrap}
.tag{margin:1px 0 0;font-size:var(--fs-cap);font-weight:500;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--tap);padding:0 14px;border:0;border-radius:var(--r);
  background:var(--ac);color:var(--on-ac);font-weight:800;font-size:var(--fs-sm);white-space:nowrap}
.cta:active{filter:brightness(.92)}
.notice{position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top));z-index:999;min-height:32px;display:flex;align-items:center;gap:6px;
  padding:6px 16px;font-size:var(--fs-cap);font-weight:700;background:var(--ac-bg);color:var(--ac-tx);border-bottom:1px solid var(--ac-line)}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.notice[hidden]{display:none}
body.has-notice{--notice-h:33px}

/* 아래 탭 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:1200;display:flex;max-width:820px;margin:0 auto;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--veil);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:var(--fs-cap);color:var(--tx3);font-weight:700;min-width:0}
nav.tabs button .i{width:22px;height:22px}
nav.tabs button.on{color:var(--ac-tx)}
nav.tabs button.on .i{stroke-width:2.2}

main{padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom))}
section.page{display:none;padding:16px}
section.page.on{display:block}
section#p-map{padding:0}
.ph{margin:4px 0 12px}
.ph h2{font-size:var(--fs-2xl);margin:0;letter-spacing:-.5px;line-height:1.3}
.ph p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--tx2)}
h3{margin:20px 0 8px;font-size:var(--fs-lg);letter-spacing:-.3px}
h3 .n{font-size:var(--fs-sm);color:var(--tx3);font-weight:700;margin-left:4px}
.muted{color:var(--tx2)} .tiny{font-size:var(--fs-cap);color:var(--tx3)}

/* 칩 · 두 칸 고르기 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.fade{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent);padding-right:28px}
.chip{position:relative;flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--tx2);border-radius:999px;
  padding:0 14px;height:38px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip:after{content:"";position:absolute;left:-1px;right:-1px;top:-4px;bottom:-4px}     /* 테두리 밖 3px씩 → 누르는 영역 44px */
.chip.on{color:var(--on-ac);background:var(--ac);border-color:var(--ac)}
.chip.cond.on{color:var(--ac-tx);background:var(--ac-bg);border-color:var(--ac)}
.chip.cond.on:before{content:"✓";font-weight:900}
.seg{display:flex;background:var(--soft);border-radius:var(--r);padding:3px;gap:3px;margin:4px 0 8px}
.seg button{flex:1;white-space:nowrap;border:0;background:none;border-radius:9px;padding:0 8px;font-weight:800;color:var(--tx2);min-height:var(--tap);font-size:var(--fs-sm)}
.seg button.on{background:var(--card);color:var(--ac-tx);box-shadow:var(--sh-1)}

/* 지도 */
.map-wrap{position:relative;height:calc(100dvh - var(--head-h) - var(--notice-h) - var(--tab-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#map{position:absolute;inset:0;background:#e9ecef}
.map-top{position:absolute;top:8px;left:8px;right:8px;z-index:1010;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.map-top>*{pointer-events:auto}
.tbar{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.map-top .chips{align-self:stretch}
.map-top .chip{box-shadow:var(--sh-1)}
.map-top .chip:not(.on){background:var(--veil)}
select.gu{flex:1 1 auto;min-width:0;max-width:170px;height:var(--tap);padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);
  font-weight:800;color:var(--tx);box-shadow:var(--sh-1)}
.fab{flex:0 0 auto;height:var(--tap);min-width:var(--tap);border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:0 12px;
  font-weight:800;font-size:var(--fs-sm);color:var(--tx);box-shadow:var(--sh-1);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.fab.ic{padding:0}
.fab.on{border-color:var(--ac);color:var(--ac-tx);background:var(--ac-bg)}
.fab.add{color:var(--ac-tx)}
.map-top .sum{align-self:flex-start;max-width:100%;background:var(--veil);border-radius:var(--r-sm);padding:4px 10px;font-size:var(--fs-cap);color:var(--tx2);
  box-shadow:var(--sh-1)}
.map-top .sum b{color:var(--tx);font-size:var(--fs-sm)}
.map-top .sum .linkbtn{min-height:0;padding:0 2px}
.map-top .sum .wn{display:block;color:var(--ac-tx);font-weight:700}
.chip.when:not(.on){color:var(--ac-tx);border-color:var(--ac-line)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:10px;background:var(--veil)!important;color:var(--tx3)!important}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{width:var(--tap);height:var(--tap);line-height:var(--tap);font-size:20px;background:var(--card);color:var(--tx);border-color:var(--line)}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:var(--sh-1)!important}
.leaflet-bottom.leaflet-right{margin-bottom:4px}

/* 날씨 줄 (지도 아래) · 카드 안 날씨 */
.wxbar{position:absolute;left:8px;bottom:12px;right:64px;max-width:420px;z-index:1000;background:var(--veil);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 12px;font-size:var(--fs-sm);color:var(--tx2);box-shadow:var(--sh-2);line-height:1.45}
.wxh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.wxh b{color:var(--tx);font-size:var(--fs-sm)}
.wxh span{font-size:var(--fs-cap);color:var(--tx3);text-align:right}
.wxd{display:grid;grid-template-columns:22px 24px 1fr auto;align-items:center;gap:0 4px;min-height:24px}
.wxd .d{font-weight:800;color:var(--tx)}
.wxd .w{min-width:0}
.wxd .w b{color:var(--tx)}
.wxd .w.rain b{color:var(--ac-tx)}
.wxd .t{font-weight:700;color:var(--tx);white-space:nowrap}
.wxd .t .lo{color:var(--tx3);font-weight:500}
.wxa{font-size:var(--fs-cap);color:var(--tx3);margin-top:2px}

/* 핀 */
.pin{position:relative;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;
  background:#fff;border:2px solid #8f98a6;box-shadow:0 1px 4px rgba(16,24,40,.3)}
.pin.free{border-color:var(--ac);border-width:3px}
.pin.mine{border-style:dashed;border-color:#434b59}
.pin.sel{transform:scale(1.25);box-shadow:0 0 0 4px rgba(26,92,255,.3),0 2px 8px rgba(16,24,40,.3);z-index:2}
.pin .dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--ac);border:2px solid #fff}
.pin .ok{position:absolute;bottom:-4px;right:-6px;font-size:9px;font-weight:900;line-height:13px;padding:0 3px;border-radius:7px;background:#14171c;color:#fff}
.pin.fav:after{content:"♥";position:absolute;top:-8px;left:-6px;font-size:12px;color:var(--ac)}
.cl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;
  background:var(--ac);border:3px solid rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(16,24,40,.35)}
.me{width:16px;height:16px;border-radius:50%;background:#1a5cff;border:3px solid #fff;box-shadow:0 0 0 4px rgba(26,92,255,.25)}

/* 목록 */
.maplist{position:absolute;left:0;right:0;bottom:0;top:180px;z-index:1005;overflow:auto;background:var(--bg);padding:8px 12px 24px;border-top:1px solid var(--line)}
.lhead{font-size:var(--fs-cap);color:var(--tx3);margin:2px 2px 8px}
.lhead b{color:var(--tx);font-size:var(--fs-sm)}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:64px}
.row:active{background:var(--soft)}
.ric{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line2);font-size:18px;background:var(--card)}
.ric.free{border:3px solid var(--ac)}
.rmain{flex:1;min-width:0}
.rnm{font-weight:800;font-size:var(--fs-body);line-height:1.35}
.rmeta{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta .rain{color:var(--ac-tx);font-weight:700}
.rnext{font-size:var(--fs-sm);margin-top:4px;color:var(--tx2)}
.rdist{flex:0 0 auto;font-size:var(--fs-cap);color:var(--tx3);font-weight:700}

/* 아래에서 올라오는 시트 */
.backdrop{position:fixed;inset:0;z-index:1090;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:1100;max-width:820px;margin:0 auto;max-height:72dvh;overflow:auto;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 30px rgba(16,24,40,.2);
  transform:translateY(calc(100% + 90px));transition:transform .22s ease;padding:0 12px 16px;overscroll-behavior:contain}
.sheet.on{transform:none}
.sbar{position:sticky;top:0;z-index:3;height:48px;display:flex;align-items:center;justify-content:flex-end;background:var(--bg);margin:0 -12px;padding:0 6px}
.sbar .grab{position:absolute;left:50%;top:8px;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--line2)}
.sbar .x{width:var(--tap);height:var(--tap);border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.sbar .x .i{width:22px;height:22px}

/* 시설 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin:0 0 12px}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .ic{font-size:26px;line-height:1.15;flex:none}
.card .nm{font-weight:900;font-size:var(--fs-lg);line-height:1.35;letter-spacing:-.3px;min-width:0;flex:1}
.card .nm small{display:block;font-weight:500;font-size:var(--fs-sm);color:var(--tx3);margin-top:2px;letter-spacing:0}
.heart{margin:-8px -8px 0 0;border:0;background:none;min-width:var(--tap);min-height:var(--tap);display:flex;align-items:center;justify-content:center;
  color:var(--tx3);flex:0 0 auto}
.heart .i{width:24px;height:24px}
.ibtn{margin:-8px -6px 0 0;border:0;background:none;min-width:var(--tap);min-height:var(--tap);display:flex;align-items:center;justify-content:center;
  color:var(--tx3);flex:0 0 auto}
.ibtn .i{width:22px;height:22px}
.heart.on{color:var(--ac)}
.heart.on .i{fill:currentColor}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.b{font-size:var(--fs-cap);font-weight:800;border-radius:6px;padding:2px 8px;border:1px solid var(--line2);color:var(--tx2);background:var(--card);white-space:nowrap}
.b.ac{color:var(--on-ac);background:var(--ac);border-color:var(--ac)}
.b.acl{color:var(--ac-tx);background:var(--ac-bg);border-color:var(--ac-line)}
.b.gray{color:var(--tx3);background:var(--soft);border-color:var(--line)}
.b.ex{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.kv{display:grid;grid-template-columns:68px 1fr;gap:6px 12px;font-size:var(--fs-sm);margin:12px 0 0}
.kv dt{color:var(--tx3);font-weight:700}
.kv dd{margin:0;min-width:0}
.kv a{display:inline-block;min-height:24px}
.box{border-radius:var(--r);padding:12px;margin-top:12px;background:var(--soft);font-size:var(--fs-sm)}
.box.line{background:var(--card);border:1px solid var(--line)}
.box.ac{background:var(--ac-bg)}
.box h4{margin:0 0 6px;font-size:var(--fs-sm);color:var(--tx);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.box h4 .tiny{font-weight:500}
.box .wxd{min-height:28px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px;font-size:var(--fs-cap);font-weight:700}
.svc{border-top:1px solid var(--line);padding:10px 0 4px}
.svc:first-of-type{border-top:0;padding-top:4px}
.svc .sn{font-weight:800;font-size:var(--fs-sm);line-height:1.4}
.svc .sm{font-size:var(--fs-cap);color:var(--tx2);margin-top:2px}
.st{display:inline-block;font-size:var(--fs-cap);font-weight:900;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px;white-space:nowrap;line-height:1.5}
.st.open{background:var(--ac);color:var(--on-ac)}
.st.soon{background:var(--card);color:var(--ac-tx);border:1.5px solid var(--ac)}
.st.full,.st.closed,.st.paused{background:var(--soft);color:var(--tx3)}
.st.info{background:var(--card);color:var(--tx3);border:1px solid var(--line2)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;font-weight:800;font-size:var(--fs-sm);
  border-radius:var(--r);padding:0 14px;min-height:var(--tap);border:1px solid var(--line2);background:var(--card);color:var(--tx);min-width:0}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.btn.sm{flex:0 0 auto;padding:0 12px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:active:not([disabled]){filter:brightness(.95)}
details.more>summary{cursor:pointer;font-weight:800;font-size:var(--fs-sm);color:var(--ac-tx);min-height:var(--tap);display:flex;align-items:center;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
.warnline{color:var(--warn);font-size:var(--fs-cap);font-weight:800;margin:6px 0 0}
.src{font-size:var(--fs-cap);color:var(--tx3);margin:12px 0 0}

/* 접수 달력 */
.toolbar{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.field{display:flex;align-items:center;gap:10px}
.field label{font-size:var(--fs-sm);font-weight:800;color:var(--tx2);flex:none}
.toolbar select,.mform select{width:100%;height:var(--tap);padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);color:var(--tx)}
.count{font-size:var(--fs-cap);color:var(--tx3);margin:6px 0 4px}
.count b{color:var(--tx);font-size:var(--fs-sm)}
h3.wk{margin:22px 0 2px;font-size:var(--fs-lg);color:var(--tx)}
h3.wk:first-child{margin-top:8px}
h4.day{margin:12px 0 6px;font-size:var(--fs-sm);color:var(--ac-tx);display:flex;gap:6px;align-items:baseline}
h4.day small{color:var(--tx3);font-weight:700;font-size:var(--fs-cap)}
.crow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.crow .t{font-weight:900;font-size:var(--fs-sm);color:var(--ac-tx)}
.crow .t.end{color:var(--tx)}
.crow .f{font-weight:800;font-size:var(--fs-body);line-height:1.35;margin-top:2px}
.crow .s{font-size:var(--fs-cap);color:var(--tx2);margin-top:2px}
.crow .btns{margin-top:10px}
.allbox{margin-top:16px}
.subrow{margin:2px 0 4px}
.subrow .btn{flex:1 1 0}
/* 구독 안내 · 제보 시트 */
.card p.lead{margin:6px 0 0;font-size:var(--fs-sm);line-height:1.55}
.btns.col{flex-direction:column}
.btns.col .btn{width:100%}
ol.steps{padding-left:20px;margin:12px 0 0;font-size:var(--fs-sm);color:var(--tx2)}
ol.steps li{margin:4px 0}
fieldset.kinds{border:0;padding:0;margin:12px 0 0;min-width:0}
fieldset.kinds legend{font-size:var(--fs-sm);font-weight:800;color:var(--tx2);padding:0;margin-bottom:2px}
.mform fieldset.kinds label.chk{margin:0;border-top:1px solid var(--line)}
.mform fieldset.kinds label.chk:first-of-type{border-top:0}
.favacts{margin:0 0 10px}

/* 정보 */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px}
details.acc>summary{padding:0 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:800;cursor:pointer;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);margin:-4px 4px 0 0}
details.acc[open]>summary:after{transform:rotate(225deg);margin-top:4px}
details.acc>div{padding:0 16px 14px;font-size:var(--fs-sm)}
details.acc ul{padding-left:18px;margin:4px 0}
details.acc li{margin:5px 0}
.srcrow{border-top:1px solid var(--line);padding:10px 0;font-size:var(--fs-sm)}
.srcrow:first-child{border-top:0;padding-top:0}
.srcrow a{display:inline-flex;align-items:center;min-height:32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.stats div{background:var(--soft);border-radius:var(--r);padding:8px 10px}
.stats b{display:block;font-size:var(--fs-xl);line-height:1.2}
.stats span{font-size:var(--fs-cap);color:var(--tx3)}

/* 입력 */
.search{width:100%;height:var(--tap);padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);color:var(--tx)}
.search.sm{box-shadow:var(--sh-1);margin:2px 0}
textarea.search{height:auto;padding:10px 12px}
.mform label{display:block;margin:14px 0 6px;font-size:var(--fs-sm);font-weight:800;color:var(--tx2)}
.mform label.chk{display:flex;align-items:center;gap:10px;min-height:var(--tap);margin:8px 0 0;color:var(--tx);font-weight:700}
.mform label.chk input{width:22px;height:22px;margin:0;accent-color:var(--ac)}
.mform textarea{resize:vertical;min-height:80px;font-family:inherit}
input,select,textarea{font-size:16px!important}
::placeholder{color:var(--tx3);opacity:1}
.linkbtn{border:0;background:none;color:var(--ac-tx);font-weight:800;text-decoration:underline;padding:0 6px;font-size:var(--fs-sm);min-height:var(--tap)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:700;
  padding:10px 16px;border-radius:999px;z-index:3000;opacity:0;transition:.2s;pointer-events:none;font-size:var(--fs-sm);max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* 빈 화면 · 불러오는 중 · 오류 */
.empty{padding:28px 16px;text-align:center;color:var(--tx2);font-size:var(--fs-sm)}
.empty b{display:block;color:var(--tx);font-size:var(--fs-body);margin-bottom:4px}
.empty .btn{margin-top:12px;flex:0 0 auto}
.state{position:absolute;inset:0;z-index:1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;
  background:var(--bg);color:var(--tx2);font-size:var(--fs-sm)}
.state b{color:var(--tx);font-size:var(--fs-lg)}
.state .btn{flex:0 0 auto;margin-top:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--ac-bg);border-top-color:var(--ac);animation:spin .8s linear infinite;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 내 코트 위치 고르기 */
.pickx,.pickbar{display:none}
.picking .map-top,.picking .maplist,.picking .wxbar,.picking .leaflet-control-zoom{display:none!important}
.picking .pickx{display:block;position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:600;pointer-events:none}
.pickx:before,.pickx:after{content:"";position:absolute;background:var(--ac)}
.pickx:before{left:21px;top:0;width:2px;height:44px}
.pickx:after{top:21px;left:0;width:44px;height:2px}
.picking .pickbar{display:block;position:absolute;left:8px;right:8px;bottom:12px;z-index:650;background:var(--card);border:1px solid var(--ac);border-radius:var(--r-lg);padding:12px;font-size:var(--fs-sm);box-shadow:var(--sh-2)}

body.map-on main{padding-bottom:0}
body.map-on{overflow:hidden;overscroll-behavior:none}
@media (max-width:419px){ .tag .w{display:none} }
@media (max-width:374px){
  .fab .t{display:none}
  .fab{padding:0;width:var(--tap)}
  .tbar{gap:5px}
  select.gu{max-width:none}
  .cta{padding:0 10px}
}
@media (max-width:340px){ .tag{display:none} }
@media (max-height:520px){
  :root{--head-h:48px;--tab-h:52px}
  .map-top .sum,.wxbar{display:none}
  .sheet{max-height:80dvh}
}
/* 태블릿 이상: 시트·글은 가운데 폭을 줄여 읽기 쉽게 */
@media (min-width:700px){
  section.page:not(#p-map)>*{max-width:680px;margin-left:auto;margin-right:auto}
  .sheet{max-width:640px}
}
/* 데스크톱: 시설 카드는 오른쪽 패널, 목록은 왼쪽 패널 (지도가 같이 보이게) */
@media (min-width:1000px){
  #app,nav.tabs{max-width:1200px}
  .sheet{left:auto;right:max(16px,calc((100vw - 1200px) / 2 + 16px));top:calc(var(--head-h) + var(--notice-h) + 16px);bottom:calc(var(--tab-h) + 16px);
    width:420px;max-height:none;border-radius:var(--r-lg);box-shadow:var(--sh-2);transform:translateX(calc(100% + 40px));border:1px solid var(--line)}
  .sheet.on{transform:none}
  .backdrop{background:transparent}
  .maplist{right:auto;width:420px;border-right:1px solid var(--line);box-shadow:var(--sh-2)}
  .map-top{right:auto;width:640px}
  /* 카드 패널이 열리면 확대·축소 버튼을 패널 왼쪽으로 옮기고 투명 배경막 위로 올려 바로 누를 수 있게
     (지도 오른쪽 끝 → 패널 바깥 여백 16 + 패널 폭 420 + 간격 10 = 446) */
  .leaflet-right .leaflet-control-zoom{transition:margin-right .22s ease}
  body.sheet-on .leaflet-bottom.leaflet-right{z-index:1095}
  body.sheet-on .leaflet-right .leaflet-control-zoom{margin-right:446px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

function tileLayer() {

let selId = null, sheetOpen = false;

  const m = mine.find(x => x.id === id); if (!m) return;
  if (!confirm(`'${m.n}'을(를) 내 코트에서 지울까요?`)) return;
  mine = mine.filter(x => x.id !== id); saveMine(); rebuildMineF();
  closeSheet(); renderMarkers(); renderMine(); toast("지웠어요");
}
function renderMine() {
  const el = $("#mineBox"); if (!el || !D) return;
  const favList = F.filter(f => favs.has(f.id) && !f.mine);
  const mineList = F.filter(f => f.mine);
  const favSoonN = favSoon().length;
  el.innerHTML = `<h3>찜한 시설<span class="n">${num(favList.length)}곳</span></h3>
    ${favList.length ? `<div class="btns favacts"><button class="btn" data-fav-map="1">${ico("map")}지도에서 모아 보기</button>
      ${favSoonN ? `<button class="btn" data-ics-fav="1">${ico("calplus")}접수일 ${num(favSoonN)}건 캘린더에</button>` : ""}</div>` : ""}
    ${favList.length ? favList.map(f => rowHTML(f, myPos)).join("")
      : `<div class="card empty"><b>아직 찜한 시설이 없어요</b>시설 카드 오른쪽 위의 하트를 누르면 여기에 모여요.</div>`}
    <h3>내 코트<span class="n">${num(mineList.length)}곳</span></h3>
    <div class="card">
      <p style="margin:0 0 8px">지도에 없는 코트를 직접 넣어 쓸 수 있어요. 지도에는 점선 핀으로 보이고, <b>이 폰 브라우저에만</b> 저장돼요.</p>
      ${mineList.length ? mineList.map(f => rowHTML(f, myPos)).join("") : ""}
      <div class="btns"><button class="btn p" data-mine="add">${ico("plus")}지도에서 추가</button></div>
      <div class="btns"><button class="btn" data-mine="export" ${mine.length || favs.size ? "" : "disabled"}>${ico("down")}파일로 내보내기</button><button class="btn" data-mine="import">${ico("up")}파일 불러오기</button></div>
      <p class="tiny" style="margin:10px 0 0">폰을 바꿀 때 파일로 내보낸 뒤 새 폰에서 불러오세요. 찜 목록도 같이 저장돼요.</p>
      <input type="file" id="mineFile" accept=".json,application/json" hidden></div>`;
}
// 찜한 곳 묶음: 앞으로 접수가 시작되는 예약(최대 50건)
function favSoon() {
  return F.filter(f => favs.has(f.id) && !f.mine).flatMap(f => soonSvcs(f).map(s => ({f, s}))).sort((a, b) => (a.s.rb < b.s.rb ? -1 : 1)).slice(0, 50);
}
function icsFav() {
  const items = favSoon(); if (!items.length) return;
  saveICS(ICS.makeICS(items.map(({f, s}) => svcEvent(f, s, false)), {calName: "동네코트 찜한 곳 접수"}), `dongne-court-fav-${todayStr()}.ics`);
}
function favOnMap() {
  MF.sp = new Set(Object.keys(SP)); MF.conds = new Set(["fav"]); MF.q = ""; $("#mapQ").value = "";
  MF.gu = "all"; $("#guSel").value = "all";
  mapViewSet = true; go("map"); setListMode(false); syncChips(); renderMarkers();
  const lls = F.filter(f => favs.has(f.id) && f.ll).map(f => f.ll);
  if (map && lls.length) setTimeout(() => { map.invalidateSize(); map.fitBounds(L.latLngBounds(lls).pad(0.25), {maxZoom: 15}); }, 60);
}
async function exportMine() {
  const day = kstNow().slice(0, 10);
  const json = JSON.stringify({app: "dongne-court", v: 1, exported: day, courts: mine, favs: [...favs]}, null, 1);
  const name = `dongne-court-my-places-${day}.json`;
  const file = new File([json], name, {type: "application/json"});
  if (navigator.maxTouchPoints > 0 && navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: "동네코트 내 장소"}); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("파일로 저장했어요");
}
function importMine(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data; try { data = JSON.parse(fr.result); } catch (e) { toast("파일을 읽지 못했어요"); return; }
    const arr = Array.isArray(data) ? data : data && data.courts;
    if (!Array.isArray(arr)) { toast("동네코트 내 장소 파일이 아니에요"); return; }
    let n = 0;
    arr.slice(0, 300).forEach(x => { const it = cleanMine(x); if (!it) return; const i = mine.findIndex(m => m.id === it.id); if (i >= 0) mine[i] = it; else mine.push(it); n++; });
    (Array.isArray(data.favs) ? data.favs : []).slice(0, 1000).forEach(id => { if (typeof id === "string" && byId[id]) favs.add(id); });
    saveMine(); saveFav(); rebuildMineF(); renderMarkers(); renderMine();
    toast(n ? `${num(n)}곳 불러왔어요` : "찜 목록을 불러왔어요");
  };
  fr.readAsText(file);
}
function mineClick(e) {
  const pk = e.target.closest("[data-pick]");
  if (pk && picking) {
    const a = pk.dataset.pick, pick = picking;
    if (a === "me") { locate(); return true; }
    endPick();
    if (a === "ok") { const c = map.getCenter(); openMineForm(Object.assign({}, pick.draft, {ll: [+c.lat.toFixed(6), +c.lng.toFixed(6)]})); }
    else if (pick.back) openMineForm(pick.draft);
    return true;
  }
  const ed = e.target.closest("[data-mine-edit]");
  if (ed) { const m = mine.find(x => x.id === ed.dataset.mineEdit); if (m) openMineForm(m); return true; }
  const dl = e.target.closest("[data-mine-del]");
  if (dl) { deleteMine(dl.dataset.mineDel); return true; }
  const m = e.target.closest("[data-mine]");
  if (!m) return false;
  const a = m.dataset.mine;
  if (a === "save") saveMineForm();
  else if (a === "cancel") closeSheet();
  else if (a === "repick") { const d = readMineForm(); closeSheet(true); startPick(d, true); }
  else if (a === "add") startPick({});
  else if (a === "export") exportMine();
  else if (a === "import") $("#mineFile").click();
  return true;
}

      <div class="srcrow"><b>✓ 확인한 코트</b><br><span class="tiny">직접 가서 골대, 조명, 바닥, 화장실, 주차를 확인한 곳이에요. 확인한 지 6개월이 넘으면 오래된 정보라고 표시해요.</span></div>
    </div></details>

      <ul><li>사진은 사람 얼굴과 차량 번호가 안 보이게 찍어 주세요</li><li>보내 주신 사진은 동의한 범위에서만 써요</li></ul>
      <div class="btns"><button class="btn p" data-report="">${ico("plus")}새 코트 알리기</button></div>
      <p class="tiny" style="margin:8px 0 0">틀린 정보는 시설 카드 아래 <b>정보가 틀렸어요</b>로 알려 주세요.${rep ? "" : " 제보 창구는 공개 때 열려요."}</p></div></details>

      <li>한 번 열어 두면 신호가 없어도 목록, 시설 카드, 접수 달력이 열려요(지도 바탕 그림만 인터넷이 필요해요)</li>

function renderNotice() {
  const el = $("#notice");
  const staleKeys = Object.entries(META.stale || {}).filter(([, v]) => v).map(([k]) => k);
  const names = {reservations: "예약", facilities: "시설", weather: "날씨", air: "미세먼지"};
  let html = "", warn = false;
  if (META.offline) html = "키 없이 만든 예시 화면이에요. 날씨와 일부 시설은 가짜예요";
  else if (staleKeys.length) { warn = true; html = `${staleKeys.map(k => names[k] || k).join("·")} 원천 서비스가 점검 중이에요. ${fmtStamp(META.built)} 기준 정보예요`; }
  else if (dayDiff(META.built.slice(0, 10), kstNow().slice(0, 10)) >= 2) { warn = true; html = `${fmtStamp(META.built)} 기준 정보예요. 갱신이 늦어지고 있어요`; }
  el.hidden = !html; el.innerHTML = esc(html); el.classList.toggle("warn", warn);
  document.body.classList.toggle("has-notice", !!html);
}

// ── 전역 클릭 ──
document.addEventListener("click", e => {
  if (mineClick(e)) return;
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const id = fav.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id); saveFav();
    $$(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.classList.toggle("on", favs.has(id)));
    $$(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.setAttribute("aria-pressed", favs.has(id)));
    toast(favs.has(id) ? "찜했어요. 내 장소에서 볼 수 있어요" : "찜을 풀었어요");
    if (markers[id]) markers[id].setIcon(pinIcon(byId[id], selId === id));
    if (MF.conds.has("fav")) renderMarkers();
    return;
  }
  const ic = e.target.closest("[data-ics]");
  if (ic) { icsFor(ic.dataset.fid, ic.dataset.ics, !!ic.dataset.end); return; }
  if (e.target.closest("[data-ics-all]")) { icsAll(); return; }
  const rp = e.target.closest("[data-report]");
  if (rp) { showSheet(reportHTML(byId[rp.dataset.report] || null)); return; }
  if (e.target.closest("[data-rp=send]")) { sendReport(); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const f = byId[sh.dataset.share]; if (f) shareLink(facilityLink(f), `${f.n} · 동네코트`); return; }
  if (e.target.closest("[data-share-cal]")) { shareLink(calLink(), "접수 달력 · 동네코트"); return; }
  if (e.target.closest("[data-sub]")) { showSheet(subHTML()); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, "구독 주소를 복사했어요"); return; }
  if (e.target.closest("[data-fav-map]")) { favOnMap(); return; }
  if (e.target.closest("[data-ics-fav]")) { icsFav(); return; }
  const rs = e.target.closest("[data-reset]");
  if (rs) { resetMap(); return; }
  if (e.target.closest("[data-retry]")) { location.reload(); return; }
  const om = e.target.closest("[data-onmap]");
  if (om) { showOnMap(om.dataset.onmap); return; }
  const op = e.target.closest("[data-open]");
  if (op) { openSheet(op.dataset.open); return; }
  const t = e.target.closest("nav.tabs button");
  if (t) go(t.dataset.tab);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); openSheet(e.target.dataset.open); }
  if (e.key === "Escape" && sheetOpen) closeSheet();
});
document.addEventListener("change", e => {
  if (e.target.id === "mineFile" && e.target.files && e.target.files[0]) { importMine(e.target.files[0]); e.target.value = ""; }
});
$("#sheetX").addEventListener("click", () => closeSheet());
$("#backdrop").addEventListener("click", () => closeSheet());
(() => {   // 카드 위쪽에서 아래로 쓸어내리면 닫기
  const sh = $("#sheet"); let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 && !e.target.closest("input,textarea,select") ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener("touchmove", e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, {passive: true});
  sh.addEventListener("touchend", e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transform = ""; if (dy > 90) closeSheet(); });
})();
window.addEventListener("popstate", () => {
  if (sheetOpen) { closeSheet(true); return; }
  go((location.hash || "#map").slice(1), true);
});

// ── 시작: 데이터 읽기 (서비스워커가 저장해 둔 것 → 오프라인에서도 열림) ──
function start(data) {
  D = data; META = data.meta || {}; SP = data.sports || {};
  F = (data.facilities || []).slice();
  F.forEach(f => { byId[f.id] = f; });
  mine = store.get("mine", []).map(cleanMine).filter(Boolean);
  mine.forEach(m => { const f = mineToF(m); F.push(f); byId[f.id] = f; });
  renderNotice();
  initMap(); initCal(); renderInfo(); renderMine();
  $("#loadState").remove();
  const linked = applyLink();
  go((location.hash || "#map").slice(1));
  if (linked) showOnMap(linked);
  window.__dc = {F, byId, stateOf, kstNow};   // 점검용
}
fetch(CFG.DATA_URL || "data/all.json", {cache: "no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(start)
  .catch(() => {
    const st = $("#loadState"); if (!st) return;
    st.setAttribute("role", "alert");
    st.innerHTML = `<b>시설 정보를 불러오지 못했어요</b><span>인터넷 연결을 확인한 뒤 다시 불러와 주세요.<br>한 번 열어 두면 다음부터는 신호가 없어도 열려요.</span>
      <button class="btn p" type="button" data-retry="1">${ico("refresh")}다시 불러오기</button>`;
  });
})();
