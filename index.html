<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="동네코트: 서울 공공 체육시설 지도. 농구·야구·풋살·테니스·배드민턴 코트 위치, 예약 접수일, 이번 주말 날씨를 한 화면에.">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동네코트"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>동네코트 · 서울 공공 체육시설 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>/* 동네코트 — 2026-11-23 디자인 개편 '코트 도면'
   브랜드는 먹(잉크)과 콘크리트 바탕 두 색뿐이고, 색은 종목만 쓴다(실제 코트 바닥색: 농구공 주황·내야 흙·잔디·하드코트 파랑·체육관 보라·회색).
   종목색은 '어떤 종목인가'라는 한 가지 뜻에만. 글꼴 원티드 산스 한 가지, 굵기·자간으로 위계.
   색·글자 크기는 아래 토큰만 쓴다. 어두운 모드는 토큰만 바꾼다. 대비 4.5:1 이상(tests/test_ui_tokens.py). */
:root{
  color-scheme:light;
  /* 바탕: 콘크리트 · 카드(시트·목록) · 눌린 칸 */
  --bg:#eef0ec; --card:#fbfcfa; --soft:#e3e7e1; --veil:rgba(251,252,250,.93); --line:#d9ded7; --line2:#c3cac2;
  /* 글자 */
  --tx:#141a17; --tx2:#4a544e; --tx3:#5d6761;
  /* 주 버튼·선택 = 먹 한 가지 */
  --ac:#141a17; --on-ac:#fbfcfa; --ac-tx:#141a17; --ac-bg:#dde3dc; --ac-line:#b6bfb7;
  --warn:#8a4300; --warn-bg:#fbeedd; --warn-line:#ecc79a;
  --rain:#24589a;
  --shade:rgba(14,19,16,.42);
  /* 종목색 (흰 선 아이콘과 3:1 이상) */
  --sp-basketball:#c9522a; --sp-baseball:#8b5a34; --sp-soccer:#2e7a4c; --sp-tennis:#2b62a6; --sp-badminton:#73509a; --sp-etc:#5b6770;
  /* 글자 */
  --sans:"Wanted Sans Variable","Wanted Sans",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs-cap:12.5px; --fs-sm:13.5px; --fs-body:15.5px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:28px;
  /* 모양: 떠 있는 것만 그림자 */
  --tap:44px; --tab-h:62px; --notice-h:0px;
  --sh-float:0 1px 0 rgba(255,255,255,.5) inset,0 10px 28px -12px rgba(14,19,16,.38),0 0 0 1px rgba(14,19,16,.06);
  --sh-chip:0 1px 2px rgba(14,19,16,.10),0 0 0 1px rgba(14,19,16,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111513; --card:#191e1b; --soft:#232a26; --veil:rgba(25,30,27,.93); --line:#2c3430; --line2:#3d4741;
    --tx:#eef1ee; --tx2:#c2cbc5; --tx3:#a0aaa3;
    --ac:#eef1ee; --on-ac:#111513; --ac-tx:#eef1ee; --ac-bg:#2c3530; --ac-line:#4a554f;
    --warn:#ffc37a; --warn-bg:#2d2114; --warn-line:#5c4220;
    --rain:#93b8ee;
    --shade:rgba(0,0,0,.58);
    --sp-basketball:#d9623a; --sp-baseball:#a06c44; --sp-soccer:#3a8c5c; --sp-tennis:#3f76bd; --sp-badminton:#8a68b2; --sp-etc:#6c7880;
    --sh-float:0 10px 28px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
    --sh-chip:0 1px 2px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);
  }
  .leaflet-tile-pane{filter:invert(1) grayscale(1) brightness(.74) contrast(.9)!important}
  #map{background:#1a1f1c!important}
}
.c-basketball{--c:var(--sp-basketball)} .c-baseball{--c:var(--sp-baseball)} .c-soccer{--c:var(--sp-soccer)}
.c-tennis{--c:var(--sp-tennis)} .c-badminton{--c:var(--sp-badminton)} .c-etc{--c:var(--sp-etc)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:var(--fs-body);line-height:1.55;letter-spacing:-.01em;
  word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--tx);text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
h1,h2,h3,h4{text-wrap:balance}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.i.s{width:16px;height:16px;vertical-align:-3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
#app{max-width:820px;margin:0 auto;min-height:100%;position:relative}

/* 맨 위 알림 띠 (예시 화면·점검 중일 때만) */
.notice{position:relative;z-index:1010;min-height:36px;display:flex;align-items:center;gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) 16px 6px;font-size:var(--fs-cap);font-weight:600;background:var(--soft);color:var(--tx)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice[hidden]{display:none}
body.has-notice{--notice-h:calc(36px + env(safe-area-inset-top))}

/* 떠 있는 알약 탭바 */
nav.tabs{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1200;
  width:calc(100% - 24px);max-width:440px;height:var(--tab-h);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;
  border-radius:999px;background:var(--veil);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--sh-float)}
nav.tabs button{border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;font-weight:600;color:var(--tx2);min-width:0;transition:background .2s,color .2s}
nav.tabs button .i{width:21px;height:21px}
nav.tabs button.on{color:var(--tx);background:var(--ac-bg)}
nav.tabs button.on .i{stroke-width:2.1}

main{padding-bottom:calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))}
section.page{display:none;padding:calc(22px + env(safe-area-inset-top)) 18px 16px}
body.has-notice section.page{padding-top:22px}
section.page.on{display:block}
section#p-map{padding:0}
.ph{margin:6px 0 18px}
.ph h2{font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.035em;line-height:1.2;margin:0}
.ph p{margin:8px 0 0;font-size:14.5px;color:var(--tx2);line-height:1.55;max-width:34em}
h3{margin:28px 0 10px;font-size:var(--fs-lg);font-weight:600;letter-spacing:-.02em}
h3 .n{font-size:var(--fs-sm);color:var(--tx2);font-weight:500;margin-left:6px}
.muted{color:var(--tx2)} .tiny{font-size:var(--fs-cap);color:var(--tx3)}

/* 칩 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:5px 0;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips.fade{-webkit-mask-image:linear-gradient(to right,#000 86%,transparent);mask-image:linear-gradient(to right,#000 86%,transparent);padding-right:28px}
.chip{position:relative;flex:0 0 auto;border:0;background:var(--card);color:var(--tx);border-radius:999px;box-shadow:var(--sh-chip);
  padding:0 13px;height:38px;font-size:14px;font-weight:550;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:after{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px}     /* 겉모습 38px + 위아래 3px → 누르는 영역 44px */
.chip .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.chip .i{width:16px;height:16px}
.chip.on{color:var(--on-ac);background:var(--ac);box-shadow:none}
.chip.on .sw{box-shadow:0 0 0 1.5px var(--on-ac)}
.chips .sep{flex:0 0 1px;align-self:stretch;margin:10px 3px;background:var(--line2)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px;margin:4px 0 10px}
.seg button{flex:1;white-space:nowrap;border:0;background:none;border-radius:999px;padding:0 10px;font-weight:600;color:var(--tx2);min-height:var(--tap);font-size:14.5px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh-chip)}

/* 구 고르기: 알약 모양 select */
.gubox{position:relative;flex:0 0 auto}
.gubox:after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:1.7px solid var(--tx2);border-bottom:1.7px solid var(--tx2);
  transform:rotate(45deg);pointer-events:none}
.gubox select{appearance:none;-webkit-appearance:none;height:var(--tap);padding:0 34px 0 15px;border-radius:999px;border:0;background:var(--card);color:var(--tx);
  font-family:inherit;font-weight:600;box-shadow:var(--sh-chip);max-width:150px;text-overflow:ellipsis}
.gubox.wide select{width:100%;max-width:none}

/* ── 지도 ── */
.map-wrap{position:relative;height:calc(100dvh - var(--notice-h))}
#map{position:absolute;inset:0;background:#e6e9e4}
.leaflet-tile-pane{filter:grayscale(1) contrast(.86) brightness(1.07)}
.map-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:1010;display:flex;flex-direction:column;pointer-events:none}
body.has-notice .map-top{top:10px}
.map-top>*{pointer-events:auto}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.sbox{flex:1 1 auto;min-width:0;display:flex;align-items:center;height:48px;padding:0 4px 0 12px;border-radius:999px;background:var(--card);box-shadow:var(--sh-float)}
.sbox input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--tx);font-family:inherit;font-weight:500;padding:0 6px 0 10px;outline-offset:-2px}
.sbox input::-webkit-search-cancel-button{display:none}
.sbtn{flex:none;width:var(--tap);height:var(--tap);border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.sbtn.on{background:var(--soft)}
.map-top .gubox select{height:48px;box-shadow:var(--sh-float)}
/* 브랜드 표식: 위에서 본 코트(가운데 줄 + 가운데 원) */
.mark{position:relative;flex:none;width:24px;height:24px;border-radius:7px;background:var(--tx)}
.mark:before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1.6px;margin-left:-.8px;background:var(--bg)}
.mark:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border:1.6px solid var(--bg);border-radius:50%;box-sizing:border-box;background:var(--tx)}
.mapbtn{position:absolute;right:12px;bottom:calc(var(--dh,220px) + 28px);z-index:1004;width:46px;height:46px;border:0;border-radius:50%;background:var(--card);color:var(--tx);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-float)}
.mapbtn.on{color:#2f6fed}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:10px;background:var(--veil)!important;color:var(--tx2)!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{width:var(--tap);height:var(--tap);line-height:var(--tap);font-size:20px;background:var(--card);color:var(--tx);border-color:var(--line)}
.leaflet-bar{border:0!important;box-shadow:var(--sh-float)!important;border-radius:14px!important;overflow:hidden}
@media (pointer:coarse){ .leaflet-control-zoom{display:none} }

/* 아래 서랍: 몇 곳인지 한 문장 + 내 주변·목록 + 날씨 한 줄. 목록을 열면 위로 펼쳐진다 */
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:1005;display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px -14px rgba(14,19,16,.35),0 0 0 1px rgba(14,19,16,.05);padding:6px 16px calc(var(--tab-h) + 22px + env(safe-area-inset-bottom))}
.dgrab{position:relative;width:36px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 8px;flex:none;cursor:pointer}
.dgrab:after{content:"";position:absolute;left:-60px;right:-60px;top:-12px;bottom:-10px}
.dhead{touch-action:pan-x}
.dhead{position:relative;flex:none;min-height:46px}
.dbtns{position:absolute;top:0;right:0;display:flex;gap:6px}
.pbtn{height:var(--tap);display:inline-flex;align-items:center;gap:6px;padding:0 15px;border:0;border-radius:999px;background:var(--soft);color:var(--tx);font-weight:600;font-size:14.5px;white-space:nowrap}
.pbtn.p{background:var(--ac);color:var(--on-ac)}
.pbtn .i{width:18px;height:18px}
.sum{font-size:15px;color:var(--tx);line-height:1.4}
.sum b{display:block;font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:44px;height:44px}
.sum b small{font-size:17px;font-weight:550;letter-spacing:-.02em;margin-left:2px}
.sum .cap{display:block;font-weight:500;margin-top:2px}
.sum .ex{display:block;font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
.sum .wn{display:block;font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
.sum .linkbtn{padding:0;min-height:var(--tap)}
.wxstrip{flex:none;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--tx2)}
.wxstrip[hidden]{display:none}
.wxstrip .wl{font-weight:600;color:var(--tx)}
.wxstrip .wdy{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.wxstrip .wdy b{color:var(--tx);font-weight:600}
.wxstrip .wdy .i{width:18px;height:18px}
.wxstrip .rain,.rain{color:var(--rain);font-weight:600}
.maplist{flex:1;min-height:0;overflow:auto;margin:10px -16px 0;padding:0 16px 8px;border-top:1px solid var(--line);overscroll-behavior:contain}
.map-wrap.listing .drawer{border-radius:22px 22px 0 0}
.map-wrap.listing .mapbtn{display:none}
.lhead{font-size:var(--fs-cap);color:var(--tx2);margin:12px 0 2px}

/* 목록 한 줄: 종목 타일 + 이름 + 한 줄 정보 */
.row{display:flex;gap:13px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:70px}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.ric{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff}
.ric .i{width:23px;height:23px;stroke-width:1.7}
.ric.free{border-radius:50%}
.ric.mine{background:var(--card);color:var(--tx);border:1.6px dashed var(--tx2)}
.rmain{flex:1;min-width:0}
.rnm{font-weight:600;font-size:16px;line-height:1.35;letter-spacing:-.02em}
.rmeta{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px;display:flex;flex-wrap:wrap;gap:0 10px}
.rnext{font-size:var(--fs-sm);margin-top:4px;color:var(--tx);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rdist{flex:0 0 auto;font-size:var(--fs-cap);color:var(--tx2);font-weight:600}
.cur{display:inline-flex;align-items:center;gap:2px;color:var(--tx);font-weight:600}
.cur .i{width:15px;height:15px;stroke-width:2.2}

/* 핀: 종목색 네모(예약) · 동그라미(무료) */
.pin{position:relative;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--c);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(14,19,16,.32)}
.pin .i{width:17px;height:17px;stroke-width:2}
.pin.free{border-radius:50%}
.pin.mine{background:#fff;color:#141a17;border:2px dashed #141a17}
.pin.sel{transform:scale(1.22);box-shadow:0 0 0 4px rgba(20,26,23,.28),0 3px 10px rgba(14,19,16,.35);z-index:2}
.pin .dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#141a17;border:2px solid #fff}
.pin .ok{position:absolute;bottom:-5px;right:-6px;width:15px;height:15px;border-radius:50%;background:#fff;color:#141a17;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.pin .ok .i{width:11px;height:11px;stroke-width:3}

.cl{width:40px;height:40px;border-radius:50%;padding:4px;box-shadow:0 2px 7px rgba(14,19,16,.3)}
.cl b{display:flex;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;background:#141a17;color:#fff;font-weight:650;font-size:13px;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.hit{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.me{width:16px;height:16px;border-radius:50%;background:#2f6fed;border:3px solid #fff;box-shadow:0 0 0 5px rgba(47,111,237,.22)}

/* ── 아래에서 올라오는 시트 ── */
.backdrop{position:fixed;inset:0;z-index:1250;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1300;max-width:820px;margin:0 auto;max-height:88dvh;overflow:auto;
  background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(14,19,16,.22);
  transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s;padding:0 0 calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sbar{position:sticky;top:0;z-index:5;height:0}
.sbar .grab{position:absolute;left:50%;top:8px;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:rgba(128,136,130,.55)}
.sbar .x{position:absolute;right:10px;top:10px;width:var(--tap);height:var(--tap);border:0;background:var(--veil);border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--tx);box-shadow:var(--sh-chip)}
.sbar .x .i{width:20px;height:20px}

/* 시설 카드: 맨 위에 그 종목 코트 도면 */
.card{padding:0 20px 6px}
.card.form,.card.sub{padding-top:26px}
.card.form .nm,.card.sub .nm{margin-right:48px}
.plate{position:relative;margin:0 -20px 18px;height:124px;background:var(--c);overflow:hidden}
.plate svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.82);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plate svg .net{stroke-width:3.2;stroke:rgba(255,255,255,.95)}
.plate .spn{position:absolute;left:20px;bottom:12px;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.plate .spn .i{width:18px;height:18px}
.plate.mine{background:var(--soft)}
.plate.mine svg{stroke:var(--line2)}
.plate.mine .spn{color:var(--tx)}
.card .nm{font-weight:600;font-size:var(--fs-xl);line-height:1.28;letter-spacing:-.035em;margin:0}
.card .loc{margin:5px 0 0;font-size:14px;color:var(--tx2)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0 0;font-size:var(--fs-sm);color:var(--tx2);font-weight:500}
.tags .ex{color:var(--warn);font-weight:600}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin:18px 0 2px}
.act{min-height:62px;border:0;border-radius:16px;background:var(--soft);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12.5px;font-weight:600;text-decoration:none;padding:6px 1px;text-align:center;line-height:1.2;min-width:0}
.act .i{width:22px;height:22px}
.act:active{filter:brightness(.95)}
.heart.on .i{fill:currentColor}
.sec{border-top:1px solid var(--line);padding:16px 0 2px;margin-top:18px}
.sec h4{margin:0 0 8px;font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h4 small{font-size:var(--fs-cap);color:var(--tx2);font-weight:500;letter-spacing:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--tx2);font-weight:500}
.kv dd{margin:0;min-width:0}
.kv a{display:inline-block;min-height:24px}
.svc{border-top:1px solid var(--line);padding:12px 0 6px}
.svc:first-of-type{border-top:0;padding-top:2px}
.svc .sn{font-weight:600;font-size:15px;line-height:1.4;display:flex;align-items:baseline;gap:8px}
.svc .sm{font-size:var(--fs-sm);color:var(--tx2);margin-top:3px}
.svc .sm b{color:var(--tx);font-weight:600}
.st{display:inline-flex;align-items:center;flex:none;font-size:12px;font-weight:650;border-radius:999px;padding:0 8px;height:22px;white-space:nowrap;letter-spacing:0}
.st.open{background:var(--ac);color:var(--on-ac)}
.st.soon{color:var(--tx);box-shadow:inset 0 0 0 1.3px var(--tx)}
.st.full,.st.closed,.st.paused,.st.info{background:var(--soft);color:var(--tx2)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;font-weight:600;font-size:14.5px;
  border-radius:999px;padding:0 16px;min-height:var(--tap);border:0;background:var(--soft);color:var(--tx);min-width:0}
.btn.p{background:var(--ac);color:var(--on-ac)}
.btn.sm{flex:0 0 auto;padding:0 14px;font-size:14px}
.btn .i{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){filter:brightness(.95)}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px;min-height:var(--tap);display:flex;align-items:center;list-style:none;text-decoration:underline;text-underline-offset:3px}
details.more>summary::-webkit-details-marker{display:none}
.warnline{color:var(--warn);font-size:var(--fs-sm);font-weight:600;margin:8px 0 0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.foot .src{font-size:var(--fs-cap);color:var(--tx3);margin:0}
.wxd{display:grid;grid-template-columns:24px 22px 1fr auto;align-items:center;gap:0 8px;min-height:32px;font-size:14px}
.wxd .d{font-weight:600}
.wxd .i{width:20px;height:20px}
.wxd .w{min-width:0;color:var(--tx2)}
.wxd .t{font-weight:600;white-space:nowrap}
.wxd .t .lo{color:var(--tx2);font-weight:500}
.wxa{font-size:var(--fs-sm);color:var(--tx2);margin-top:6px}

/* ── 접수 달력: 왼쪽 날짜 칸 + 오른쪽 그날 접수 ── */
.toolbar{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px}
.subrow{margin:8px 0 4px}
.subrow .btn{flex:1 1 0}
.count{font-size:var(--fs-sm);color:var(--tx2);margin:18px 0 0}
.count b{color:var(--tx);font-weight:600}
h3.wk{margin:26px 0 0;font-size:15px;color:var(--tx2);font-weight:600;letter-spacing:-.01em}
.dgrp{display:grid;grid-template-columns:50px 1fr;gap:14px;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:10px}
h3.wk+.dgrp{border-top:0;margin-top:4px}
.dcol{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;padding-top:2px}
.dcol b{font-size:27px;font-weight:600;letter-spacing:-.04em}
.dcol span{font-size:var(--fs-sm);color:var(--tx2);margin-top:3px}
.dcol em{font-style:normal;font-size:12px;font-weight:650;margin-top:6px;padding:1px 7px;border-radius:999px;background:var(--ac);color:var(--on-ac)}
.dcol em.later{background:none;color:var(--tx2);padding:0;font-weight:600}
.crow{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line);cursor:pointer}
.drows .crow:last-child{border-bottom:0;margin-bottom:0}
#calList>.crow{padding-top:14px;margin:0}
.crow .t{font-weight:600;font-size:var(--fs-sm);color:var(--tx2)}
.crow .t b{color:var(--tx);font-weight:650}
.crow .f{font-weight:600;font-size:16px;line-height:1.35;margin-top:2px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.crow .f .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.crow .s{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
.crow .btns{margin-top:10px}
.allbox{margin-top:22px}
.allbox .btn{width:100%}

/* 구독 안내 · 제보 · 내 코트 시트 */
.card p.lead{margin:8px 0 0;font-size:14.5px;line-height:1.6}
.btns.col{flex-direction:column}
.btns.col .btn{width:100%}
ol.steps{padding-left:20px;margin:16px 0 0;font-size:var(--fs-sm);color:var(--tx2)}
ol.steps li{margin:6px 0}
fieldset.kinds{border:0;padding:0;margin:14px 0 0;min-width:0}
fieldset.kinds legend{font-size:var(--fs-sm);font-weight:600;color:var(--tx2);padding:0;margin-bottom:2px}
.mform fieldset.kinds label.chk{margin:0;border-top:1px solid var(--line)}
.mform fieldset.kinds label.chk:first-of-type{border-top:0}
.favacts{margin:0 0 6px}

/* 내 장소 · 정보: 흰 묶음 */
.group{background:var(--card);border-radius:18px;padding:2px 14px}
.group .row:last-child{border-bottom:0}
.group.pad{padding:16px}
.group.pad p{margin:0}
.intro{font-size:15px;line-height:1.65;margin:0 0 6px}
.numline{font-size:var(--fs-sm);color:var(--tx2);margin:6px 0 20px}
.numline b{color:var(--tx);font-weight:600}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc>summary{min-height:58px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px;letter-spacing:-.02em;cursor:pointer;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"";width:8px;height:8px;border-right:1.7px solid var(--tx2);border-bottom:1.7px solid var(--tx2);transform:rotate(45deg);margin:-4px 6px 0 0;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(-135deg);margin-top:4px}
details.acc>div{padding:0 0 18px;font-size:14.5px}
details.acc ul{padding-left:18px;margin:4px 0}
details.acc li{margin:6px 0}
.srcrow{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.srcrow:first-child{border-top:0;padding-top:0}
.srcrow b{font-weight:600}
.srcrow a{display:inline-flex;align-items:center;gap:3px;min-height:32px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:4px 0 12px}
.legend span{display:flex;align-items:center;gap:8px;font-size:14px}
.legend .pin{width:26px;height:26px;border-width:1.6px;box-shadow:none}
.legend .pin .i{width:15px;height:15px}
.endnote{font-size:var(--fs-cap);color:var(--tx3);margin:22px 0 0}

/* 입력 */
.search{width:100%;height:var(--tap);padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font-family:inherit}
textarea.search{height:auto;padding:12px 14px}
.mform label{display:block;margin:16px 0 6px;font-size:var(--fs-sm);font-weight:600;color:var(--tx2)}
.mform label.chk{display:flex;align-items:center;gap:10px;min-height:var(--tap);margin:8px 0 0;color:var(--tx);font-weight:500;font-size:15px}
.mform label.chk input{width:20px;height:20px;margin:0;accent-color:var(--ac)}
.mform select{width:100%;height:var(--tap);padding:0 12px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font-family:inherit}
.mform textarea{resize:vertical;min-height:84px;font-family:inherit}
input,select,textarea{font-size:16px!important}
::placeholder{color:var(--tx3);opacity:1}
.linkbtn{border:0;background:none;color:var(--tx);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0 4px;font-size:var(--fs-sm);min-height:var(--tap);
  display:inline-flex;align-items:center;gap:6px}
.linkbtn .i{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:600;
  padding:11px 18px;border-radius:999px;z-index:3000;opacity:0;transition:.2s;pointer-events:none;font-size:var(--fs-sm);max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* 빈 화면 · 불러오는 중 · 오류 */
.empty{padding:30px 16px;text-align:center;color:var(--tx2);font-size:var(--fs-sm)}
.empty b{display:block;color:var(--tx);font-size:16px;font-weight:600;margin-bottom:4px}
.empty .eic{display:flex;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--soft);align-items:center;justify-content:center;color:var(--tx2)}
.empty .eic .i{width:26px;height:26px}
.empty .btn{margin-top:14px;flex:0 0 auto}
.state{position:absolute;left:0;right:0;bottom:0;z-index:1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  padding:26px 20px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom));background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px -14px rgba(14,19,16,.35),0 0 0 1px rgba(14,19,16,.05);color:var(--tx2);font-size:var(--fs-sm)}
.state b{color:var(--tx);font-size:var(--fs-lg);font-weight:600}
.state .btn{flex:0 0 auto;margin-top:12px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--tx);animation:spin .8s linear infinite;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 내 코트 위치 고르기 */
.pickx,.pickbar{display:none}
.picking .map-top,.picking .drawer,.picking .mapbtn,.picking .leaflet-control-zoom{display:none!important}
.picking .pickx{display:block;position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:600;pointer-events:none}
.pickx:before,.pickx:after{content:"";position:absolute;background:var(--tx)}
.pickx:before{left:21px;top:0;width:2px;height:44px}
.pickx:after{top:21px;left:0;width:44px;height:2px}
.picking .pickbar{display:block;position:absolute;left:10px;right:10px;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));z-index:650;background:var(--card);
  border-radius:20px;padding:14px;font-size:14.5px;box-shadow:var(--sh-float)}
.pickbar p{margin:0}

body.map-on main{padding-bottom:0}
body.map-on{overflow:hidden;overscroll-behavior:none}
/* 지도 아래 컨트롤(출처 표시)은 서랍 위로 */
@media (max-width:999px){ .leaflet-bottom{bottom:var(--dh,0px)} }
@media (max-width:359px){
  .act{font-size:11.5px}
  .card{padding:0 16px 6px}
  .plate{margin:0 -16px 16px}
  .pbtn{padding:0 12px}
  #nearBtn .t{display:none}
  #nearBtn{width:var(--tap);padding:0;justify-content:center}
  .map-top .gubox select{max-width:118px;padding-left:12px}
}
@media (max-height:600px){
  .wxstrip{display:none!important}
  .sum .wn,.sum .ex{display:none}
  .sheet{max-height:92dvh}
}
/* 태블릿 이상: 글은 가운데 폭을 줄여 읽기 쉽게 */
@media (min-width:700px){
  section.page:not(#p-map)>*{max-width:640px;margin-left:auto;margin-right:auto}
  .state{left:50%;right:auto;width:560px;margin-left:-280px}
  .sheet{max-width:600px;border-radius:24px 24px 0 0}
  .drawer{left:50%;right:auto;width:560px;margin-left:-280px}
}
/* 데스크톱: 서랍은 왼쪽 아래 떠 있는 판, 시설 카드는 오른쪽 패널 (지도가 같이 보이게) */
@media (min-width:1000px){
  #app{max-width:1200px}
  .drawer{left:16px;right:auto;margin:0;width:400px;bottom:calc(var(--tab-h) + 26px);border-radius:20px;padding:6px 18px 16px;box-shadow:var(--sh-float)}
  .map-wrap.listing .drawer{border-radius:20px}
  .state{left:16px;margin:0;width:400px;bottom:calc(var(--tab-h) + 26px);border-radius:20px;padding:24px;box-shadow:var(--sh-float)}
  .map-top{right:auto;width:600px;left:16px;top:16px}
  .mapbtn{right:16px;bottom:calc(var(--tab-h) + 128px)}
  .leaflet-bottom.leaflet-right{bottom:calc(var(--tab-h) + 20px)}
  .sheet{left:auto;right:max(16px,calc((100vw - 1200px) / 2 + 16px));top:16px;bottom:calc(var(--tab-h) + 26px);
    width:420px;max-width:none;max-height:none;border-radius:20px;box-shadow:var(--sh-float);transform:translateX(calc(100% + 40px))}
  .sheet.on{transform:none}
  .backdrop{background:transparent}
  /* 카드 패널이 열리면 확대·축소 버튼을 패널 왼쪽으로 옮기고 투명 배경막 위로 올려 바로 누를 수 있게
     (지도 오른쪽 끝 → 패널 바깥 여백 16 + 패널 폭 420 + 간격 10 = 446) */
  .leaflet-right .leaflet-control-zoom{transition:margin-right .22s ease}
  body.sheet-on .leaflet-bottom.leaflet-right{z-index:1255}
  body.sheet-on .leaflet-right .leaflet-control-zoom{margin-right:446px}
  body.sheet-on .mapbtn{display:none}
}
@media (prefers-reduced-transparency:reduce){ nav.tabs,.sbar .x{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
.card .loc{display:flex;flex-wrap:wrap;gap:0 10px}
.card .loc .dist{color:var(--tx);font-weight:600}
.keys{margin:12px 0 0;display:flex;flex-direction:column;gap:5px}
.key{margin:0;display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.45}
.key .i{width:18px;height:18px;margin-top:1px;color:var(--tx2)}
.key b{font-weight:650}
.keys+.tags{margin-top:8px}
.crow .s{display:flex;flex-wrap:wrap;gap:0 10px}
.pin.fav{box-shadow:0 0 0 2.5px #141a17,0 2px 6px rgba(14,19,16,.32)}
/* 검색칸: 글자 칸 안쪽 사각 테두리 대신 알약 전체에 초점 테두리 */
.sbox input:focus-visible{outline:none}
.sbox:focus-within{box-shadow:var(--sh-float),0 0 0 2px var(--tx)}
</style>
</head>

function km(a, b) {

  return 2 * R * Math.asin(Math.sqrt(h));
}

  const days = Object.keys(all).filter(d => late ? d > today : d >= today).sort();

function deleteMine(id) {
  const m = mine.find(x => x.id === id); if (!m) return;
  if (!confirm(`'${m.n}'을(를) 내 코트에서 지울까요?`)) return;
  mine = mine.filter(x => x.id !== id); saveMine(); rebuildMineF();
  closeSheet(); renderMarkers(); renderMine(); toast("지웠어요");
}
function renderMine() {
  const el = $("#mineBox"); if (!el || !D) return;
  const favList = F.filter(f => favs.has(f.id) && !f.mine);
  const mineList = F.filter(f => f.mine);
  const favSoonN = favSoon().length;
  el.innerHTML = `<h3>찜한 곳<span class="n">${num(favList.length)}곳</span></h3>
    ${favList.length ? `<div class="btns favacts"><button class="btn" data-fav-map="1">${ico("map")}지도에서 모아 보기</button>
      ${favSoonN ? `<button class="btn" data-ics-fav="1">${ico("calplus")}접수일 ${num(favSoonN)}건 캘린더에</button>` : ""}</div>
      <div class="group">${favList.map(f => rowHTML(f, myPos)).join("")}</div>`
      : `<div class="group">${emptyHTML("아직 찜한 곳이 없어요", "시설 카드에서 찜을 누르면 여기에 모여요.", "", "heart")}</div>`}
    <h3>내 코트<span class="n">${num(mineList.length)}곳</span></h3>
    <p class="muted" style="margin:0 0 10px;font-size:14.5px">지도에 없는 코트를 직접 넣어 둘 수 있어요. 지도에는 점선 핀으로 보여요.</p>
    ${mineList.length ? `<div class="group">${mineList.map(f => rowHTML(f, myPos)).join("")}</div>` : ""}
    <div class="btns"><button class="btn p" data-mine="add">${ico("plus")}지도에서 코트 추가</button></div>
    <div class="btns"><button class="btn" data-mine="export" ${mine.length || favs.size ? "" : "disabled"}>${ico("down")}파일로 내보내기</button><button class="btn" data-mine="import">${ico("up")}파일 불러오기</button></div>
    <p class="endnote">폰을 바꿀 때는 파일로 내보낸 뒤 새 폰에서 불러오세요. 찜 목록도 같이 옮겨져요.</p>
    <input type="file" id="mineFile" accept=".json,application/json" hidden>`;
}
// 찜한 곳 묶음: 앞으로 접수가 시작되는 예약(최대 50건)
function favSoon() {
  return F.filter(f => favs.has(f.id) && !f.mine).flatMap(f => soonSvcs(f).map(s => ({f, s}))).sort((a, b) => (a.s.rb < b.s.rb ? -1 : 1)).slice(0, 50);
}
function icsFav() {
  const items = favSoon(); if (!items.length) return;
  saveICS(ICS.makeICS(items.map(({f, s}) => svcEvent(f, s, false)), {calName: "동네코트 찜한 곳 접수"}), `dongne-court-fav-${todayStr()}.ics`);
}
function favOnMap() {
  MF.sp = new Set(Object.keys(SP)); MF.conds = new Set(["fav"]); MF.q = ""; $("#mapQ").value = ""; syncSearchBtn();
  MF.gu = "all"; $("#guSel").value = "all";
  mapViewSet = true; go("map"); setListMode(false, "quiet"); syncChips(); renderMarkers();
  const lls = F.filter(f => favs.has(f.id) && f.ll).map(f => f.ll);
  if (map && lls.length) setTimeout(() => { map.invalidateSize(); map.fitBounds(L.latLngBounds(lls).pad(0.2), viewPad({maxZoom: 15})); }, 60);
}
async function exportMine() {
  const day = kstNow().slice(0, 10);
  const json = JSON.stringify({app: "dongne-court", v: 1, exported: day, courts: mine, favs: [...favs]}, null, 1);
  const name = `dongne-court-my-places-${day}.json`;
  const file = new File([json], name, {type: "application/json"});
  if (navigator.maxTouchPoints > 0 && navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: "동네코트 내 장소"}); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("파일로 저장했어요");
}
function importMine(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data; try { data = JSON.parse(fr.result); } catch (e) { toast("파일을 읽지 못했어요"); return; }
    const arr = Array.isArray(data) ? data : data && data.courts;
    if (!Array.isArray(arr)) { toast("동네코트 내 장소 파일이 아니에요"); return; }
    let n = 0;
    arr.slice(0, 300).forEach(x => { const it = cleanMine(x); if (!it) return; const i = mine.findIndex(m => m.id === it.id); if (i >= 0) mine[i] = it; else mine.push(it); n++; });
    (Array.isArray(data.favs) ? data.favs : []).slice(0, 1000).forEach(id => { if (typeof id === "string" && byId[id]) favs.add(id); });
    saveMine(); saveFav(); rebuildMineF(); renderMarkers(); renderMine();
    toast(n ? `${num(n)}곳 불러왔어요` : "찜 목록을 불러왔어요");
  };
  fr.readAsText(file);
}
function mineClick(e) {
  const pk = e.target.closest("[data-pick]");
  if (pk && picking) {
    const a = pk.dataset.pick, pick = picking;
    if (a === "me") { locate(); return true; }
    endPick();
    if (a === "ok") { const c = map.getCenter(); openMineForm(Object.assign({}, pick.draft, {ll: [+c.lat.toFixed(6), +c.lng.toFixed(6)]})); }
    else if (pick.back) openMineForm(pick.draft);
    return true;
  }
  const ed = e.target.closest("[data-mine-edit]");
  if (ed) { const m = mine.find(x => x.id === ed.dataset.mineEdit); if (m) openMineForm(m); return true; }
  const dl = e.target.closest("[data-mine-del]");
  if (dl) { deleteMine(dl.dataset.mineDel); return true; }
  const m = e.target.closest("[data-mine]");
  if (!m) return false;
  const a = m.dataset.mine;
  if (a === "save") saveMineForm();
  else if (a === "cancel") closeSheet();
  else if (a === "repick") { const d = readMineForm(); closeSheet(true); startPick(d, true); }
  else if (a === "add") startPick({});
  else if (a === "export") exportMine();
  else if (a === "import") $("#mineFile").click();
  return true;
}

// ── 정보 탭 ──
function renderInfo() {
  const m = META, st = m.src_time || {}, modes = m.modes || {};
  const modeTxt = k => modes[k] === "online" || !modes[k] ? "" : ` <span class="b ex">${modes[k] === "offline-sample" ? "sample 5건씩" : modes[k] === "none" ? "아직 연결 안 됨" : "예시"}</span>`;
  const staleTxt = k => (m.stale || {})[k] ? ` <span class="warnline">· 원천 서비스 점검 중일 수 있어요</span>` : "";
  const rows = (m.sources || []).map(s => `<div class="srcrow"><b>${esc(s.n)}</b>${modeTxt(s.k)}<br>
    <span class="tiny">${esc(s.by)}, ${esc(s.lic)}</span><br>
    <span class="tiny">${fmtStamp(st[s.k])} 기준${staleTxt(s.k)}</span> <a class="tiny" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">원본 보기${ico("ext", "s")}</a></div>`).join("");
  const c = m.counts || {};
  const rep = cfg(CFG.REPORT_URL);
  const lg = (cls, k, t) => `<span><i class="pin ${cls}">${sg(k)}</i>${t}</span>`;
  $("#infoList").innerHTML = `
    <p class="intro">예약과 결제는 하지 않고, 원래 예약 사이트(서울 공공서비스예약, 구 시설관리공단)로 보내 드려요.</p>
    <p class="numline">시설 <b>${num(c.facilities)}곳</b>과 예약 <b>${num(c.services)}건</b>을 담고 있어요. ${fmtStamp(m.built)}에 새로 받았어요.</p>
    <details class="acc" open><summary>지도 보는 법</summary><div>
      <div class="legend">${Object.keys(SP).map(k => lg("c-" + spKey(k), k, esc(SP[k].n))).join("")}</div>
      <ul><li>네모 핀은 예약하는 곳, 동그라미 핀은 무료로 여는 곳이에요</li><li>핀 위 검은 점은 지금 접수중인 예약이 있다는 뜻이에요</li>
        <li>체크 표시는 직접 가서 골대, 조명, 바닥을 확인한 곳이에요</li></ul></div></details>
    <details class="acc"><summary>데이터 출처와 기준 시각</summary><div>${rows}
      <div class="srcrow"><b>지도</b><br><span class="tiny">${cfg(CFG.VWORLD_KEY) ? "브이월드(국토교통부)" : "© OpenStreetMap 기여자"}, 지도 라이브러리 Leaflet</span></div>
      <div class="srcrow"><b>확인한 코트</b><br><span class="tiny">확인한 지 6개월이 넘으면 오래된 정보라고 표시해요.</span></div>
    </div></details>
    <details class="acc"><summary>제보하기</summary><div>
      <p>정보가 틀렸거나 지도에 없는 코트를 알고 계시면 알려 주세요. 확인한 뒤에 반영해요.</p>
      <ul><li>사진은 사람 얼굴과 차량 번호가 안 보이게 찍어 주세요</li><li>보내 주신 사진은 동의한 범위에서만 써요</li></ul>
      <div class="btns"><button class="btn p" data-report="">${ico("plus")}새 코트 알리기</button></div>
      <p class="tiny" style="margin:8px 0 0">틀린 정보는 시설 카드 아래 <b>정보가 틀렸어요</b>로 알려 주세요.${rep ? "" : " 제보 창구는 공개 때 열려요."}</p></div></details>
    <details class="acc"><summary>공공시설 이용 예절</summary><div><ul>
      <li>예약한 시간은 지키고, 못 가면 미리 취소해 주세요. 다음 사람이 쓸 수 있어요</li>
      <li>무료 코트는 기다리는 사람이 있으면 돌아가며 써요</li>
      <li>밤에는 주변 집을 생각해 소리를 줄여 주세요</li>
      <li>쓰레기와 음료병은 가져가요</li>
      <li>시설마다 규칙(신분 확인, 구민 우선 등)이 달라요. 예약 사이트 안내를 먼저 보세요</li></ul></div></details>
    <details class="acc"><summary>홈 화면에 추가 · 오프라인</summary><div><ul>
      <li>아이폰: Safari <b>공유</b> → <b>홈 화면에 추가</b> / 안드로이드: 크롬 <b>⋮</b> → <b>홈 화면에 추가</b></li>
      <li>한 번 열어 두면 신호가 없어도 목록, 시설 카드, 접수 달력이 열려요(지도 바탕 그림만 인터넷이 필요해요)</li>
      <li>찜과 내 코트는 이 폰 브라우저에만 저장돼요</li></ul>
      <p class="tiny" id="swState"></p></div></details>
    <p class="endnote">예약 상태와 이용료는 바뀔 수 있으니 예약 전에 원래 사이트에서 꼭 확인하세요. 만든 사람 hwarang</p>`;
  const sw = $("#swState");
  if (sw) sw.textContent = navigator.serviceWorker && navigator.serviceWorker.controller ? "오프라인 준비 완료" : "오프라인 준비 중이에요. 다음에 열면 끝나요.";
}
function renderNotice() {
  const el = $("#notice");
  const staleKeys = Object.entries(META.stale || {}).filter(([, v]) => v).map(([k]) => k);
  const names = {reservations: "예약", facilities: "시설", weather: "날씨", air: "미세먼지"};
  let html = "", warn = false;
  if (META.offline) html = "키 없이 만든 예시 화면이에요. 날씨와 일부 시설은 가짜예요";
  else if (staleKeys.length) { warn = true; html = `${staleKeys.map(k => names[k] || k).join("·")} 원천 서비스가 점검 중이에요. ${fmtStamp(META.built)} 기준 정보예요`; }
  else if (dayDiff(META.built.slice(0, 10), kstNow().slice(0, 10)) >= 2) { warn = true; html = `${fmtStamp(META.built)} 기준 정보예요. 갱신이 늦어지고 있어요`; }
  el.hidden = !html; el.innerHTML = esc(html); el.classList.toggle("warn", warn);
  document.body.classList.toggle("has-notice", !!html);
  document.body.style.setProperty("--notice-h", html ? el.offsetHeight + "px" : "0px");
}

// ── 전역 클릭 ──
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (a && !a.matches("[data-open],[data-report]")) return;          // 줄 안의 바깥 링크는 링크로만 (줄 열기와 같이 안 일어나게)
  if (mineClick(e)) return;
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const id = fav.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id); saveFav();
    $$(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.classList.toggle("on", favs.has(id)));
    $$(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.setAttribute("aria-pressed", favs.has(id)));
    toast(favs.has(id) ? "찜했어요. 내 장소에서 볼 수 있어요" : "찜을 풀었어요");
    if (markers[id]) markers[id].setIcon(pinIcon(byId[id], selId === id));
    if (MF.conds.has("fav")) renderMarkers();
    return;
  }
  const ic = e.target.closest("[data-ics]");
  if (ic) { icsFor(ic.dataset.fid, ic.dataset.ics, !!ic.dataset.end); return; }
  if (e.target.closest("[data-ics-all]")) { icsAll(); return; }
  const rp = e.target.closest("[data-report]");
  if (rp) { showSheet(reportHTML(byId[rp.dataset.report] || null)); return; }
  if (e.target.closest("[data-rp=send]")) { sendReport(); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const f = byId[sh.dataset.share]; if (f) shareLink(facilityLink(f), `${f.n} · 동네코트`); return; }
  if (e.target.closest("[data-share-cal]")) { shareLink(calLink(), "접수 달력 · 동네코트"); return; }
  if (e.target.closest("[data-sub]")) { showSheet(subHTML()); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, "구독 주소를 복사했어요"); return; }
  if (e.target.closest("[data-fav-map]")) { favOnMap(); return; }
  if (e.target.closest("[data-ics-fav]")) { icsFav(); return; }
  const rs = e.target.closest("[data-reset]");
  if (rs) { resetMap(); return; }
  if (e.target.closest("[data-retry]")) { location.reload(); return; }
  const om = e.target.closest("[data-onmap]");
  if (om) { showOnMap(om.dataset.onmap); return; }
  const op = e.target.closest("[data-open]");
  if (op) { openSheet(op.dataset.open); return; }
  const t = e.target.closest("nav.tabs button");
  if (t) go(t.dataset.tab);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); openSheet(e.target.dataset.open); }
  if (e.key === "Escape" && sheetOpen) closeSheet();
  else if (e.key === "Escape" && listMode && !e.target.matches("input,textarea,select")) setListMode(false);
});
document.addEventListener("change", e => {
  if (e.target.id === "mineFile" && e.target.files && e.target.files[0]) { importMine(e.target.files[0]); e.target.value = ""; }
});
$("#sheetX").addEventListener("click", () => closeSheet());
(() => {   // 서랍 머리(몇 곳·버튼 줄)를 위로 끌면 목록, 목록에서 아래로 끌면 지도
  const dr = $("#drawer"); let y0 = null, dy = 0;
  const grab = e => e.target.closest(".dgrab, .dhead") && !e.target.closest("button, a, input, select");
  dr.addEventListener("touchstart", e => { y0 = grab(e) ? e.touches[0].clientY : null; dy = 0; }, {passive: true});
  dr.addEventListener("touchmove", e => {
    if (y0 === null) return; dy = e.touches[0].clientY - y0;
    const d = listMode ? Math.max(0, dy) : Math.min(0, dy) * .35;
    dr.style.transform = d ? `translateY(${Math.round(d)}px)` : "";
  }, {passive: true});
  dr.addEventListener("touchend", () => {
    if (y0 === null) return; y0 = null; dr.style.transform = "";
    if (!listMode && dy < -36) setListMode(true);
    else if (listMode && dy > 60) setListMode(false);
  });
  $(".dgrab").addEventListener("click", () => setListMode(!listMode));
})();
$("#backdrop").addEventListener("click", () => closeSheet());
(() => {   // 카드 위쪽에서 아래로 쓸어내리면 닫기
  const sh = $("#sheet"); let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 && !e.target.closest("input,textarea,select") ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener("touchmove", e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, {passive: true});
  sh.addEventListener("touchend", e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transform = ""; if (dy > 90) closeSheet(); });
})();
window.addEventListener("popstate", () => {
  if (sheetOpen) { closeSheet(true); return; }
  const tab = (location.hash || "#map").slice(1), cur = TABS.find(x => $("#p-" + x).classList.contains("on"));
  const wantList = !!(history.state && history.state.list);
  if (tab !== cur) go(tab, true);
  if (D && listMode !== wantList && (location.hash || "#map") === "#map") setListMode(wantList, "pop");
});

// ── 시작: 데이터 읽기 (서비스워커가 저장해 둔 것 → 오프라인에서도 열림) ──
function start(data) {
  D = data; META = data.meta || {}; SP = data.sports || {};
  F = (data.facilities || []).slice();
  F.forEach(f => { byId[f.id] = f; });
  mine = store.get("mine", []).map(cleanMine).filter(Boolean);
  mine.forEach(m => { const f = mineToF(m); F.push(f); byId[f.id] = f; });
  renderNotice();
  initMap(); initCal(); renderInfo(); renderMine();
  $("#loadState").remove();
  const linked = applyLink();
  go((location.hash || "#map").slice(1));
  if (linked) showOnMap(linked);
  if (history.state && history.state.sheet) history.replaceState(null, "", location.href);      // 새로고침 전에 열려 있던 카드 기록은 정리
  if (history.state && history.state.list && (location.hash || "#map") === "#map") setListMode(true, "pop");   // 목록을 보다 새로고침하면 목록 그대로
  window.__dc = {F, byId, stateOf, kstNow, map: () => map, cluster: () => cluster};   // 점검용
}
try { makeMap(); } catch (e) { /* 지도는 데이터와 같이 다시 시도 */ }
fetch(CFG.DATA_URL || "data/all.json", {cache: "no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(start)
  .catch(() => {
    const st = $("#loadState"); if (!st) return;
    st.setAttribute("role", "alert");
    st.innerHTML = `<b>시설 정보를 불러오지 못했어요</b><span>인터넷 연결을 확인한 뒤 다시 불러와 주세요.<br>한 번 열어 두면 다음부터는 신호가 없어도 열려요.</span>
      <button class="btn p" type="button" data-retry="1">${ico("refresh")}다시 불러오기</button>`;
  });
})();
</script>
